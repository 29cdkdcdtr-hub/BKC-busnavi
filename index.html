<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BKCバス">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>BKCバスナビ</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
html{background:#09090b;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
/* Layout: 1 column, phone first. Sticky clock bar on top, "next bus" cards first, hourly timetable below. Line colours identify each bus route everywhere. */
:root{
  /* Black theme: departure-board look. Amber = UI accent, red = direct shuttle only. */
  --bg:#09090b; --surface:#18181d; --surface2:#26262e; --ink:#f4f4f6; --ink2:#a6a6b2; --rule:#40404b;
  --accent:#ffb21a; --accent-ink:#141006;
  --sh:#ff5468; --net:#b3b9c7;
  --warn-bg:#2e2410; --warn-ink:#f5d98b;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --f-num:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--rule);margin-inline:-4px;padding-inline:4px}
.bar-in{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-weight:900;font-size:20px;letter-spacing:.02em}
.brand span{font-size:12px;color:var(--ink2)}
.clock{display:flex;align-items:baseline;gap:10px}
.clock .t{font-family:var(--f-num);font-size:28px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1}
.clock .d{font-size:13px;color:var(--ink2)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:10px;padding:3px;gap:3px}
.tabs button,.seg button{border:0;background:transparent;padding:8px 10px;border-radius:8px;font-weight:700;color:var(--ink2);min-height:40px}
.tabs button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* day type */
.daybox{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.pill.soft{background:var(--surface2);color:var(--ink)}
.daybox label{display:inline-flex;align-items:center;gap:6px;color:var(--ink2)}
.daybox select,.daybox input{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:4px 8px;min-height:32px}

/* generic */
h2{font-size:13px;letter-spacing:.08em;color:var(--ink2);font-weight:700;margin:0 0 8px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:14px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:10px;padding:3px;gap:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:500;min-height:34px}
.chip[aria-pressed="true"]{border-color:var(--c,var(--ink));background:color-mix(in srgb,var(--c,var(--ink)) 14%,var(--surface))}
.chip[aria-pressed="false"]{color:var(--ink2);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ink2) 50%,transparent)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--ink2));flex:none}
.note{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:10px 12px;font-size:13px}
.note a{color:inherit}
.l-sh{--c:var(--sh)}.l-ka,.l-pw,.l-pe,.l-o,.l-ks{--c:var(--net)}

/* next buses */
.next{display:grid;gap:8px}
.empty{padding:18px;text-align:center;color:var(--ink2);border:1px dashed var(--rule);border-radius:12px}

/* hourly table */
.tt{display:flex;flex-direction:column}
.hr{display:grid;grid-template-columns:34px 1fr;gap:8px;padding-block:7px;border-top:1px solid var(--rule);align-items:start}
.hr:first-child{border-top:0}
.hr .h{font-family:var(--f-num);font-size:17px;font-weight:500;padding-top:3px;font-variant-numeric:tabular-nums}
.hr.cur .h{color:var(--accent)}
.mins{display:flex;flex-wrap:wrap;gap:5px;min-width:0}
.m{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:15px;padding:3px 8px;border-radius:7px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 30%,transparent);line-height:1.4}
.m i{font-style:normal;font-size:11px;font-family:var(--f-body);margin-right:2px;opacity:.9}
.m.past{opacity:.35}
.m.nx{background:var(--c);color:var(--surface);border-color:var(--c);font-weight:500}
.legend{font-size:12px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 14px}
.tog{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.tog input{width:18px;height:18px;accent-color:var(--accent)}

/* transfer */
.dests{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.dst{text-align:left;border:1px solid var(--rule);background:var(--surface);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.dst[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.dst b{font-size:17px}
.dst span{font-size:12px;color:var(--ink2)}
.plan{display:grid;gap:10px}
.leg{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:start}
.leg .tt2{font-family:var(--f-num);font-size:18px;font-variant-numeric:tabular-nums;font-weight:500}
.leg .tt2 small{display:block;font-family:var(--f-body);font-size:11px;color:var(--ink2);font-weight:400}
.leg .bd{border-left:3px solid var(--c,var(--rule));padding-left:12px;min-width:0}
.leg .bd p{margin:0;font-size:13px;color:var(--ink2)}
.leg .bd b{font-size:15px}
.nb{display:flex;flex-direction:column;align-items:stretch;gap:6px;background:var(--surface);border:1px solid var(--rule);border-left:6px solid var(--c);border-radius:12px;padding:12px 14px}
.nb.l-sh{background:color-mix(in srgb,var(--sh) 8%,var(--surface))}
.nb:first-child{padding-block:14px}
.times{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.times .t{display:flex;flex-direction:column;line-height:1.1}
.times small{font-size:12px;color:var(--ink2);font-weight:700}
.times b{font-family:var(--f-num);font-size:32px;font-weight:500;font-variant-numeric:tabular-nums}
.nb:first-child .times b{font-size:42px}
.times .ar{font-size:22px;color:var(--ink2);padding-bottom:4px}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:4px 12px;flex-wrap:wrap}
.nb .in{font-weight:900;font-size:19px;color:var(--c);white-space:nowrap}
.nb .sub{font-size:12px;color:var(--ink2);overflow-wrap:anywhere;min-width:0}
.nb.fast{box-shadow:inset 0 0 0 2px var(--accent)}
.badge{align-self:flex-start;font-size:11px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 10px}
.m.l-sh{font-weight:500}
.brandwrap{display:flex;align-items:center;gap:12px;min-width:0}
.menu{display:inline-flex;align-items:center;justify-content:center;width:44px;height:40px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:10px;flex:none}
.menu[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mp{position:absolute;left:0;right:0;top:100%;background:var(--surface);border-bottom:1px solid var(--rule);box-shadow:0 12px 24px rgba(0,0,0,.45);max-height:calc(100vh - 120px);overflow:auto;z-index:8}
.mp-in{max-width:720px;margin:0 auto;padding:4px 8px 10px;display:flex;flex-direction:column}
.mp h4{margin:12px 0 2px;font-size:12px;letter-spacing:.08em;color:var(--ink2);font-weight:700}
.mp .item{text-align:left;border:0;border-top:1px solid var(--rule);background:transparent;padding:13px 6px;font-weight:500;min-height:46px}
.mp .item:first-child{border-top:0}
.tchip{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:13px;font-weight:500;min-height:36px}
.tchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.tt-h{display:flex;justify-content:space-between;align-items:baseline;gap:4px 12px;flex-wrap:wrap;margin-bottom:2px}
.tt-h b{font-size:16px}
.tt-h .sub,.sub{font-size:12px;color:var(--ink2)}
.m.shin{color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--surface));border-color:color-mix(in srgb,var(--accent) 45%,transparent);font-weight:500}
.m i.d{font-size:11px;margin:0 0 0 3px;opacity:.85}
.shinkey{color:var(--accent)}
.leg.best .bd{border-left-color:var(--accent)}.leg.best .tt2{color:var(--accent)}
.cd{font-variant-numeric:tabular-nums}
.goal{font-weight:900;font-size:20px}
details summary{cursor:pointer;font-weight:700;padding-block:6px}
details ul{margin:6px 0 0;padding-left:1.2em;font-size:13px;color:var(--ink2)}
details li+li{margin-top:4px}
.src a{color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.nb,.m{transition:background .2s}}

/* ---- 区切りを明確にする ---- */
body::before{background:var(--surface)}
.bar{background:var(--surface);border-bottom:2px solid var(--accent);
  margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand b{font-size:21px}
.clock{background:var(--surface2);border:1px solid var(--rule);border-radius:10px;padding:5px 12px}
.daybox{background:var(--surface2);border:1px solid var(--rule);border-radius:10px;padding:6px 10px}
.tabs,.seg{background:transparent;padding:0;gap:8px}
.tabs button,.seg button{border:1px solid var(--rule);background:var(--surface2);color:var(--ink);box-shadow:none}
.tabs button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
h2{display:flex;align-items:center;gap:8px;font-size:14px;letter-spacing:.06em;color:var(--ink);margin:0 0 8px}
h2::before{content:"";flex:none;width:4px;height:16px;border-radius:2px;background:var(--accent)}
.card{border-color:var(--rule)}
.tt-h{background:var(--surface2);margin:-14px -14px 8px;padding:10px 14px;border-bottom:1px solid var(--rule);border-radius:11px 11px 0 0}
.hr{grid-template-columns:40px 1fr;margin-inline:-6px;padding-inline:6px;border-radius:8px}
.hr:nth-child(even){background:color-mix(in srgb,var(--surface2) 55%,transparent)}
.hr .h{background:var(--surface2);border:1px solid var(--rule);border-radius:7px;text-align:center;padding:1px 0;height:fit-content}
.hr.cur .h{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.nb{border-color:var(--rule)}
.nb .in{background:color-mix(in srgb,var(--c) 20%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:999px;padding:2px 12px}
.chip,.dst,.tchip,.menu{border-color:var(--rule)}
.chip[aria-pressed="true"]{border-width:2px}
.m{border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.mp .item{border-top-color:var(--rule)}

.disc{max-width:720px;margin:28px auto 0;padding:12px 14px;border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:10px;background:var(--surface);font-size:12px;color:var(--ink2);line-height:1.7}
.disc b{display:block;color:var(--ink);font-size:13px;margin-bottom:2px}
.disc p{margin:0}

/* ---- シンプル版(バスのタブ) ---- */
.set{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 6px 4px;font-size:13px;color:var(--ink2)}
.set select,.set input{background:var(--surface2);border:1px solid var(--rule);border-radius:8px;padding:4px 8px;min-height:34px}
.subrow{display:flex;flex-direction:column;gap:8px}
.hero{display:flex;flex-direction:column;gap:6px;padding:4px 0 0}
.hero .lab{font-size:13px;font-weight:700;color:var(--ink2)}
.cdbig{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 4px;color:var(--c);line-height:1.05;min-height:76px}
.cdbig b{font-family:var(--f-num);font-size:76px;font-weight:500;font-variant-numeric:tabular-nums}
.cdbig b.soon{font-family:var(--f-body);font-size:52px;font-weight:900}
.cdbig u{text-decoration:none;font-size:20px;font-weight:700;color:var(--ink2);margin-right:10px}
.hcard{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--rule);border-left:6px solid var(--c);border-radius:12px;padding:12px 14px}
.hero.l-sh .hcard{background:color-mix(in srgb,var(--sh) 8%,var(--surface))}
.bbadge{display:inline-block;font-size:11px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 8px;margin-left:6px}
.hcard .bbadge{margin-left:0}
.lst{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:12px;background:var(--surface);overflow:hidden}
.rw{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--rule)}
.rw:first-child{border-top:0}
.dotm{width:10px;height:10px;border-radius:50%;border:2px solid var(--net);flex:none}
.rw.l-sh .dotm{background:var(--sh);border-color:var(--sh)}
.rb{min-width:0}
.rt{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 6px}
.rt b{font-family:var(--f-num);font-size:23px;font-weight:500;font-variant-numeric:tabular-nums}
.rt small{font-size:12px;color:var(--ink2);font-weight:700}
.rt .ar{color:var(--ink2)}
.rw .cd{font-weight:700;font-size:15px;white-space:nowrap;color:var(--ink)}
.rw.l-sh .cd{color:var(--sh)}
.more{border:1px solid var(--rule);background:var(--surface2);color:var(--ink);border-radius:10px;padding:12px;font-weight:700;min-height:46px}

.brand b{white-space:nowrap}
.row{flex-wrap:nowrap}
.clock{flex:none;gap:8px;padding:4px 10px}
.clock .t{font-size:24px}
@media (max-width:520px){.brand span{display:none}}

.brandwrap{flex:1;min-width:0}
.brand b{font-size:19px}
@media (max-width:430px){.clock .d{display:none}.clock{padding:4px 10px}}

.leg.best{background:color-mix(in srgb,var(--accent) 12%,var(--surface));border-radius:10px;padding:8px 10px;margin-inline:-10px}
.leg.best .bd{border-left-color:var(--accent)}
.leg .bd b{color:var(--ink)}
.leg .bd p b{font-size:17px}
.leg .tt2{color:var(--ink)}
.leg.best .tt2{color:var(--accent)}
.leg .tt2 small{color:var(--ink2)}

.setnow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:6px 0}
.setnow b{font-family:var(--f-num);font-size:34px;font-weight:500;font-variant-numeric:tabular-nums}
.setrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:10px 0;color:var(--ink2);font-size:14px}
.setrow label{display:inline-flex;align-items:center;gap:8px}
.setrow select,.setrow input{background:var(--surface2);border:1px solid var(--rule);border-radius:8px;padding:6px 10px;min-height:40px;font-size:16px;color:var(--ink)}
.card p.sub{margin:6px 0 0}
.clock.fixed{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.news{max-width:720px;margin:28px auto 0;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:14px}
.news h2{margin-bottom:6px}
.nl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.nl li{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--rule);font-size:14px}
.nl li:first-child{border-top:0}
.nd{font-family:var(--f-num);color:var(--accent);font-weight:500;font-variant-numeric:tabular-nums}
.nt{min-width:0;overflow-wrap:anywhere}
.news+.disc{margin-top:16px}

.tstrip{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--ink2);padding:5px 8px 5px 12px;background:var(--surface);border:1px solid var(--rule);border-radius:10px}
.tstrip .lbl{font-weight:700}
.tstrip input{background:var(--surface2);border:1px solid var(--rule);border-radius:7px;padding:0 6px;min-height:30px;font-size:15px;color:var(--ink);font-family:var(--f-num)}
.tstrip .st{font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:0 9px}
.tstrip .st.soft{background:var(--surface2);color:var(--ink2);font-weight:500}
.tstrip .tr{margin-left:auto;border:1px solid var(--rule);background:var(--surface2);color:var(--ink);border-radius:8px;padding:2px 10px;min-height:30px;font-size:12px;font-weight:700}
.tstrip.on{border-color:var(--accent)}

.tstrip .tset{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:2px 12px;min-height:30px;font-size:13px;font-weight:700}
.tsetb{background:var(--accent)!important;color:var(--accent-ink)!important;border-color:var(--accent)!important;font-weight:700}
</style>
</head>
<body>
<header class="bar"><div class="bar-in">
  <div class="row">
    <div class="brandwrap"><button class="menu" id="menuBtn" aria-label="メニュー" aria-expanded="false" aria-controls="menuPanel"><svg width="20" height="14" viewBox="0 0 20 14" aria-hidden="true"><path d="M0 1h20M0 7h20M0 13h20" stroke="currentColor" stroke-width="2"/></svg></button><div class="brand"><b>BKCバスナビ</b><span>南草津駅 ⇄ 立命館大学BKC</span></div></div>
    <div class="clock"><span class="t" id="clk">--:--</span><span class="d" id="dte"></span></div>
  </div>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-bus" aria-selected="true" data-tab="bus">バス時刻表</button>
    <button role="tab" id="tab-tr" aria-selected="false" data-tab="tr">乗り換え案内</button>
  </div>
</div>
<nav class="mp" id="menuPanel" aria-label="メニュー" hidden><div class="mp-in">
  <button class="item" data-go="bus">次のバス</button>
  <button class="item" data-go="tr">乗り換え案内</button>
  <button class="item" data-go="set">設定(時刻・ダイヤ)</button>
  <h4>時刻表(平日・開講ダイヤ)</h4>
  <button class="item" data-tt="to">南草津駅 → BKC</button>
  <button class="item" data-tt="from-minami">BKC → 南草津駅</button>
  <button class="item" data-tt="from-kusatsu">BKC → 草津駅・瀬田駅</button>
  <button class="item" data-tt="from-other">BKC → 松ヶ丘五丁目・長寿センター・UCD</button>
  <button class="item" data-tt="jr">JR 南草津駅(京都・大阪方面)</button>

  h+='<div class="seg" role="group" aria-label="出発地"><button data-tf="bkc" aria-pressed="'+(S.tfrom==='bkc')+'">BKCから</button><button data-tf="st" aria-pressed="'+(S.tfrom==='st')+'">南草津駅から</button></div>';
  if(S.tfrom==='st'){
    h+='<section><h2>'+fmt(nowMin)+' 以降の電車('+T.name+'方面)</h2><div class="card"><div class="plan">'+jrRows(nowMin,T)+'</div></div></section>';
  }else{
    h+='<section><h2>BKCから'+T.name+'へ</h2><div class="plan">';
    var D=DATA[m];
    if(!D)h+='<div class="note">バスのダイヤは平日(開講期間)のみ対応しています。バス時刻表タブで「平日ダイヤを参考に見る」を選ぶと表示できます。</div>';
    else{
      var bs=entries(D.from.minami,{}).filter(function(e){return e.t>=nowMin-0.001}).slice(0,2);
      if(!bs.length)h+='<div class="empty">本日のBKC発バスは終了しました。</div>';
      bs.forEach(function(e){var arr=e.t+(e.line.ride||15),ready=arr+5;
        h+='<div class="card"><div class="plan"><div class="leg"><div class="tt2">'+fmt(arr)+'<small>南草津駅着 約</small></div><div class="bd '+e.line.cls+'"><b>BKC '+fmt(e.t)+'発のバス</b><p>'+e.line.name+'。ホームまで5分とみて '+fmt(ready)+' 以降の電車に乗れます。</p></div></div>'+jrRows(ready,T)+'</div></div>'})}
    h+='</div></section>';
  }
  h+='<div class="note">電車の時刻は、提供された南草津駅の時刻表(姫路方面・4〜23時台)から作っています。特急は含めていません。平日ダイヤとして扱っています。到着時刻は発車時刻に、普通と新快速それぞれの一律の所要分を足した計算値です。京都行・大阪行の電車は、その先の駅へは行きません。</div>';
  return h}

var TTS=[{id:'to',name:'南草津駅 → BKC'},{id:'from-minami',name:'BKC → 南草津駅'},{id:'from-kusatsu',name:'BKC → 草津駅・瀬田駅'},{id:'from-other',name:'BKC → その他'},{id:'jr',name:'JR 南草津駅'}];
function ttLines(){var D=DATA.weekday;return S.tt==='to'?D.to:S.tt==='from-minami'?D.from.minami:S.tt==='from-kusatsu'?D.from.kusatsu:D.from.other}
function hourGrid(es,nowMin,curH){var by={};es.forEach(function(e){(by[e.h]=by[e.h]||[]).push(e)});
  return Object.keys(by).map(Number).sort(function(a,b){return a-b}).map(function(hh){
    return '<div class="hr'+(hh===curH?' cur':'')+'"><div class="h">'+p2(hh)+'</div><div class="mins">'+by[hh].map(function(e){
      return '<span class="m '+e.line.cls+(e.t<nowMin?' past':'')+'">'+tagHtml(e.tag)+p2(e.m)+'</span>'}).join('')+'</div></div>'}).join('')}
function jrGrid(nowMin,curH){var by={};JRL.forEach(function(x){var hh=Math.floor(x.t/60);(by[hh]=by[hh]||[]).push(x)});
  return Object.keys(by).map(Number).sort(function(a,b){return a-b}).map(function(hh){
    return '<div class="hr'+(hh===curH?' cur':'')+'"><div class="h">'+p2(hh)+'</div><div class="mins">'+by[hh].map(function(x){
      return '<span class="m '+(x.shin?'shin':'l-ks')+(x.t<nowMin?' past':'')+'">'+p2(x.t%60)+(x.a?'<i class="d">'+x.a+'</i>':'')+'</span>'}).join('')+'</div></div>'}).join('')}
function renderTT(d,m){
  var nowMin=d.getHours()*60+d.getMinutes()+d.getSeconds()/60,curH=d.getHours(),h='';
  if(m==='off')h+='<div class="note">いまは平日(開講期間)ではありません。このアプリは平日専用のため、表示は平日ダイヤの参考です。</div>';
  h+='<div class="chips" role="group" aria-label="時刻表の選択">'+TTS.map(function(x){return '<button class="tchip" data-tt="'+x.id+'" aria-pressed="'+(S.tt===x.id)+'">'+x.name+'</button>'}).join('')+'</div>';
  if(S.tt==='jr'){
    h+='<section class="card"><div class="tt-h"><b>JR琵琶湖線 南草津駅</b><span class="sub">京都・大阪方面(姫路方面行き)</span></div><div class="sub" style="margin-bottom:6px">'+JRL.length+'本 ・ 4〜23時台 ・ 平日</div><div class="tt">'+jrGrid(nowMin,curH)+'</div></section>';
    h+='<div class="legend"><span><b class="shinkey">橙</b> 新快速</span><span><b>灰</b> 普通</span><span>行先: 網=網干 加=加古川 播=播州赤穂 上=上郡 京=京都 大=大阪 西=西明石(なしは姫路行)</span></div>';
    h+='<div class="note">京都行・大阪行の電車は、その先の駅へは行きません。特急は含めていません。</div>';
    return h}
  var lines=ttLines(),arrive=(S.tt==='to'||S.tt==='from-minami'),tags={};
  lines.forEach(function(L){var es=entries([L],{});if(!es.length)return;
    es.forEach(function(e){if(e.tag)tags[e.tag]=1});
    h+='<section class="card"><div class="tt-h"><b>'+L.name+'</b><span class="sub">のりば '+L.stop+(arrive&&L.ride?' ・ 所要 約'+L.ride+'分':'')+'</span></div><div class="sub" style="margin-bottom:6px">'+es.length+'本 ・ 始発 '+fmt(es[0].t)+' ・ 最終 '+fmt(es[es.length-1].t)+'</div><div class="tt">'+hourGrid(es,nowMin,curH)+'</div></section>'});
  var tk=Object.keys(tags);
  if(tk.length)h+='<div class="legend">'+tk.map(function(t){return '<span><b>'+t+'</b> '+tagNote(t)+'</span>'}).join('')+'</div>';
  h+='<div class="legend"><span>平日・開講ダイヤ('+DATA.weekday.rev+')。薄い数字は発車済みです。</span></div>';
  return h}

var NEWS=[
 {d:'2026-10-28',t:'公開しました。現在は平日(開講期間)のダイヤのみ対応しています。'},
 {d:'2026-10-28',t:'JRの時刻は4〜23時台です。特急は含めていません。'},
 {d:'2026-10-28',t:'土日祝、休講期間、臨時ダイヤ、運休・遅延には対応していません。'}
];
function renderNews(){
  var el=document.getElementById('news');if(!el)return;
  el.innerHTML='<h2>お知らせ</h2><ul class="nl">'+NEWS.map(function(n){var a=n.d.split('-');return '<li><span class="nd">'+(+a[1])+'/'+(+a[2])+'</span><span class="nt">'+n.t+'</span></li>'}).join('')+'</ul>'}
function timeStrip(){
  return '<div class="tstrip'+(S.time?' on':'')+'"><span class="lbl">時刻</span><input type="time" id="timeSel" value="'+S.time+'" aria-label="表示する時刻を選ぶ"><button class="tset" data-tset="1">設定</button>'+
    (S.time?'<span class="st">指定中</span><button class="tr" data-treset="1">現在に戻す</button>':'<span class="st soft">現在時刻</span>')+'</div>'}
function renderSet(d,m){
  var cur=p2(d.getHours())+':'+p2(d.getMinutes()),h='';
  h+='<section class="card"><h2>表示する時刻</h2>'+
    '<div class="setnow"><span class="sub">いま使っている時刻</span><b>'+cur+'</b><span class="pill'+(S.time?'':' soft')+'">'+(S.time?'指定中':'現在時刻')+'</span></div>'+
    '<div class="setrow"><label>時刻を指定 <input type="time" id="timeSel" value="'+S.time+'"></label><button class="chip tsetb" data-tset="1">設定</button><button class="chip" data-treset="1">現在時刻に戻す</button></div>'+
    '<p class="sub">時刻を選んだあと、「設定」を押すと反映されます。その時刻を基準に「次のバス」と電車を表示し、指定中はカウントダウンが止まります。</p></section>';
  h+='<section class="card"><h2>ダイヤ</h2>'+
    '<div class="setrow"><label>切り替え <select id="modeSel"><option value="auto"'+(S.mode==='auto'?' selected':'')+'>自動</option><option value="weekday"'+(S.mode==='weekday'?' selected':'')+'>平日(開講)</option></select></label></div>'+
    '<div class="setnow"><span class="sub">いまのダイヤ</span><span class="pill">'+(m==='off'?'平日専用(いまは対象外)':DATA[m].label)+'</span></div>'+
    '<p class="sub">土日祝と休講期間は未対応です。「自動」では、平日の開講期間だけダイヤを表示します。</p></section>';
  return h}

function render(){
  var d=nowDate(),m=effMode(d),el=document.getElementById('main');
  document.getElementById('clk').textContent=p2(d.getHours())+':'+p2(d.getMinutes());
  document.getElementById('dte').textContent=(d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')';
  var ck=document.querySelector('.clock');if(ck)ck.classList.toggle('fixed',!!S.time);
  ['bus','tr'].forEach(function(t){document.getElementById('tab-'+t).setAttribute('aria-selected',String(S.tab===t))});
  var y=window.scrollY;
  el.innerHTML=(S.tab==='bus'||S.tab==='tr'?timeStrip():'')+(S.tab==='bus'?renderBus(d,m):S.tab==='tt'?renderTT(d,m):S.tab==='set'?renderSet(d,m):renderTr(d,m));
  renderNews();
  var mp=document.getElementById('menuPanel'),mb=document.getElementById('menuBtn');if(mp)mp.hidden=!S.menu;if(mb)mb.setAttribute('aria-expanded',String(S.menu));
  window.scrollTo(0,y)}

document.addEventListener('click',function(e){
  var b=e.target.closest('button');
  if(b&&b.id==='menuBtn'){S.menu=!S.menu;render();return}
  if(S.menu&&!e.target.closest('#menuPanel')){S.menu=false;if(!b){render();return}}
  if(!b)return;
  S.menu=false;
  if(b.dataset.go){S.tab=b.dataset.go;window.scrollTo(0,0);try{history.replaceState(null,'','#'+S.tab)}catch(x){}}
  else if(b.dataset.tt){S.tab='tt';S.tt=b.dataset.tt;window.scrollTo(0,0);try{history.replaceState(null,'','#tt')}catch(x){}}
  else if(b.dataset.tab){S.tab=b.dataset.tab;try{history.replaceState(null,'','#'+S.tab)}catch(x){}}
  else if(b.dataset.tset){var ti=document.getElementById('timeSel');if(ti&&ti.value)S.time=ti.value;else return}
  else if(b.dataset.treset){S.time='';lastMin=-1}
  else if(b.dataset.kind)S.kind=b.dataset.kind;
  else if(b.dataset.dir)S.dir=b.dataset.dir,S.hidden={};
  else if(b.dataset.dest)S.dest=b.dataset.dest,S.hidden={};
  else if(b.dataset.line)S.hidden[b.dataset.line]=!S.hidden[b.dataset.line];
  else if(b.dataset.td)S.tdest=b.dataset.td;
  else if(b.dataset.tf)S.tfrom=b.dataset.tf;
  else if(b.dataset.mode)S.mode=b.dataset.mode;
  else return;
  render()});
document.addEventListener('change',function(e){
  if(e.target.id==='hp')S.hidePast=e.target.checked;
  else if(e.target.id==='modeSel')S.mode=e.target.value;
  else if(e.target.id==='timeSel')return;
  else return;
  render()});
window.addEventListener('hashchange',function(){var t=location.hash.slice(1);if(t==='bus'||t==='tr'||t==='tt'||t==='set'){S.tab=t;render()}});
(function(){var t=location.hash.slice(1);if(t==='tr'||t==='tt'||t==='set')S.tab=t})();
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.menu){S.menu=false;render()}});
render();
var lastMin=-1;
setInterval(function(){
  if(S.time)return;
  var d=new Date(),mm=d.getMinutes();
  if(mm!==lastMin){lastMin=mm;render();return}
  if(S.tab!=='bus')return;
  var nowSec=d.getHours()*3600+mm*60+d.getSeconds(),need=false;
  document.querySelectorAll('.cd').forEach(function(n){
    var r=+n.getAttribute('data-t')*60-nowSec;
    n.textContent=cdText(r)});
  document.querySelectorAll('.hero-cd').forEach(function(n){
    var r=+n.getAttribute('data-t')*60-nowSec;
    if(r<=0)need=true;else n.innerHTML=heroHtml(r)});
  if(need)render()
},1000);
</script>
</body>
</html>
